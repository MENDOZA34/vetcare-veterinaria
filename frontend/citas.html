<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas - Veterinaria</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/citas.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <nav class="nav">
      <a class="marca" href="index.html"><span class="marca-svg"></span><span>VetCare</span></a>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="clientes.html">Clientes</a>
        <a href="mascotas.html">Mascotas</a>
        <a href="veterinarios.html">Veterinarios</a>
        <a href="tratamientos.html">Tratamientos</a>
        <a href="historial.html">Historial</a>
      </div>
    </nav>
  </header>

  <main class="contenedor">
    <section class="titulo-pagina">
      <h1>Agenda de citas</h1>
      <p>Organiza las consultas veterinarias y actualiza el estado de atencion.</p>
    </section>

    <section class="panel-formulario">
      <form id="formCita" class="formulario">
        <input type="hidden" id="id_cita">
        <label>Fecha <input type="date" id="fecha" required></label>
        <label>Hora <input type="time" id="hora" required></label>
        <label>Motivo <input type="text" id="motivo" required></label>
        <label>Estado
          <select id="estado" required>
            <option value="pendiente">Pendiente</option>
            <option value="atendida">Atendida</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </label>
        <label>Propietario <select id="id_cliente" required></select></label>
        <label>Mascota <select id="id_mascota" required></select></label>
        <label>Veterinario <select id="id_veterinario" required></select></label>
        <div class="acciones-form">
          <button type="submit" class="boton principal">Guardar cita</button>
          <button type="button" class="boton secundario" id="btnLimpiar">Limpiar</button>
        </div>
      </form>
      <p id="mensaje" class="mensaje"></p>
      <div id="accionTratamientoCita" class="acciones-form accion-atendida"></div>
      <p class="nota-seguridad">Actualiza el estado de la cita segun el proceso de atencion.</p>
    </section>

    <section class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Motivo</th>
            <th>Estado</th>
            <th>Propietario</th>
            <th>Mascota</th>
            <th>Veterinario</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaCitas"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
